<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problemas · El cuaderno de Stacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/estilo.css">
<style>
.filters{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.pb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:12px 0}
.pb.solved{border-color:var(--ok)}
.pb .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.pb .meta span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px}
.pb .meta .lv{background:var(--paper);color:var(--muted)}
.pb p.en{margin:6px 0 8px;font-size:17px}
.pb .sol{font-family:var(--mono);font-size:15px;line-height:1.8;margin:6px 0 0}
.pb .solvebtn{margin-top:8px}
.count{font-size:14px;color:var(--muted)}
</style>
</head>
<body data-base="../" data-nav="problemas">
<main>
  <div class="crumb"><a href="../index.html">Inicio</a><span>Problemas</span></div>
  <h1>Problemas</h1>
  <p class="lede">Intenta cada uno en tu cuaderno antes de mirar. Si te trabas, abre la pista; la solución, solo al final.</p>
  <div class="filters">
    <div class="seg" id="fT" role="group" aria-label="Filtrar por tema"></div>
    <div class="seg" id="fL" role="group" aria-label="Filtrar por dificultad">
      <button data-k="0" aria-pressed="true">Todas</button><button data-k="1" aria-pressed="false">★ Fácil</button><button data-k="2" aria-pressed="false">★★ Media</button><button data-k="3" aria-pressed="false">★★★ Reto</button>
    </div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script src="../assets/datos.js"></script>
<script src="../assets/kit.js"></script>
<script>
(function(){
/* Para agregar un problema: copia un bloque y cambia el texto. tema = id del tema en datos.js */
const PROBLEMAS=[
  {id:'p1',tema:'funcion',nivel:1,en:'Si f(x) = x² − 2x, calcula f(−3).',pista:'Reemplaza cada x por (−3), con paréntesis.',sol:'f(−3) = (−3)² − 2(−3)<br>= 9 + 6<br>= 15'},
  {id:'p2',tema:'funcion',nivel:2,en:'Si f(x) = 2x + k y además f(3) = 11, ¿cuánto vale k?',pista:'Escribe f(3) con la fórmula e iguálalo a 11.',sol:'f(3) = 2·3 + k = 6 + k<br>6 + k = 11<br>k = 5'},
  {id:'p3',tema:'dominio',nivel:1,en:'Halla el dominio de f(x) = (x + 1) / (x − 7).',pista:'¿Qué valor haría cero el denominador?',sol:'x − 7 ≠ 0 → x ≠ 7<br>Dom f = ℝ − {7}'},
  {id:'p4',tema:'dominio',nivel:2,en:'Halla el dominio de f(x) = √(8 − 2x).',pista:'Lo de adentro de la raíz debe ser ≥ 0. Cuidado al despejar.',sol:'8 − 2x ≥ 0<br>8 ≥ 2x<br>x ≤ 4<br>Dom f = ⟨−∞ ; 4]'},
  {id:'p5',tema:'dominio',nivel:3,en:'Halla el dominio de f(x) = √(x − 1) / (x − 5).',pista:'Hay dos condiciones a la vez: la de la raíz y la del denominador.',sol:'Raíz: x − 1 ≥ 0 → x ≥ 1<br>Denominador: x ≠ 5<br>Dom f = [1 ; 5⟩ ∪ ⟨5 ; +∞⟩'},
  {id:'p6',tema:'dominio',nivel:2,en:'Halla el rango de f(x) = x² + 3.',pista:'¿Cuál es el valor más pequeño que puede tener x²?',sol:'x² ≥ 0 para todo x<br>x² + 3 ≥ 3<br>Ran f = [3 ; +∞⟩'},
  {id:'p7',tema:'clasificacion',nivel:1,en:'Clasifica como algebraica o trascendente: a) x³ − x   b) 5ˣ   c) 1/(x + 2)   d) cos x',pista:'Busca si la x está en un exponente, en un log o en un seno/coseno.',sol:'a) algebraica (polinómica)<br>b) trascendente (exponencial)<br>c) algebraica (racional)<br>d) trascendente (trigonométrica)'},
  {id:'p8',tema:'polinomicas',nivel:2,en:'Para f(x) = x² − 6x + 5, halla el vértice y los puntos donde corta al eje x.',pista:'El vértice está en h = −b / 2a. Para las raíces, factoriza.',sol:'h = −(−6) / (2·1) = 3<br>k = f(3) = 9 − 18 + 5 = −4 → vértice (3 ; −4)<br>x² − 6x + 5 = (x − 1)(x − 5) → corta en x = 1 y x = 5'},
  {id:'p9',tema:'polinomicas',nivel:3,en:'Un taxi cobró S/ 7 por 2 km y S/ 13 por 5 km. Si la tarifa es lineal, ¿cuánto cobra por 10 km?',pista:'Halla la pendiente con los dos puntos: (2 ; 7) y (5 ; 13).',sol:'m = (13 − 7) / (5 − 2) = 2<br>7 = 2·2 + b → b = 3<br>f(x) = 2x + 3<br>f(10) = 23 → S/ 23'},
  {id:'p10',tema:'trascendentes',nivel:2,en:'Resuelve 2ˣ⁺¹ = 16.',pista:'Escribe 16 como una potencia de 2.',sol:'16 = 2⁴<br>2ˣ⁺¹ = 2⁴ → x + 1 = 4<br>x = 3'},
  {id:'p11',tema:'trascendentes',nivel:1,en:'Calcula log₃ 81.',pista:'¿3 elevado a qué da 81?',sol:'3⁴ = 81<br>log₃ 81 = 4'},
  {id:'p12',tema:'trascendentes',nivel:3,en:'Hay 500 bacterias y se duplican cada hora. Escribe la función y calcula cuántas habrá en 5 horas.',pista:'Cada hora se multiplica por 2: es exponencial con base 2.',sol:'N(t) = 500 · 2ᵗ<br>N(5) = 500 · 32<br>= 16 000 bacterias'},
  {id:'p13',tema:'mru',nivel:1,en:'Un bus va a 15 m/s con MRU. ¿Qué distancia recorre en 2 minutos?',pista:'Pasa los minutos a segundos y usa d = v · t.',sol:'2 min = 120 s<br>d = v · t = 15 · 120<br>d = 1800 m = 1,8 km'},
  {id:'p14',tema:'mru',nivel:1,en:'Convierte 90 km/h a m/s.',pista:'De km/h a m/s se divide entre 3,6.',sol:'90 / 3,6 = 25<br>90 km/h = 25 m/s'},
  {id:'p15',tema:'mru',nivel:2,en:'Un auto con MRU estaba en x = 30 m cuando t = 2 s, y en x = 70 m cuando t = 6 s. Halla su velocidad y su posición inicial x₀.',pista:'La velocidad es la pendiente: (cambio de x) / (cambio de t). Luego usa x = x₀ + v · t.',sol:'v = (70 − 30) / (6 − 2) = 40 / 4 = 10 m/s<br>30 = x₀ + 10 · 2 → x₀ = 10 m<br>x = 10 + 10t'},
  {id:'p16',tema:'mru',nivel:3,en:'Ana sale de x = 0 corriendo a 4 m/s. Beto sale al mismo tiempo desde x = 60 m caminando a 1 m/s, en el mismo sentido. ¿En qué instante Ana alcanza a Beto y en qué posición?',pista:'Se encuentran cuando sus posiciones son iguales: escribe x de cada uno e iguálalas.',sol:'Ana: x = 4t<br>Beto: x = 60 + t<br>4t = 60 + t → 3t = 60 → t = 20 s<br>x = 4 · 20 = 80 m'},
  {id:'p17',tema:'magnitudes',nivel:1,en:'Convierte 72 km/h a m/s y 0,5 h a segundos.',pista:'1 km = 1000 m y 1 h = 3600 s. Para km/h → m/s divide entre 3,6.',sol:'72 km/h = 72 / 3,6 = 20 m/s<br>0,5 h = 0,5 · 3600 s = 1800 s'},
  {id:'p18',tema:'magnitudes',nivel:2,en:'Una botella tiene 1,5 L de agua. ¿Cuántos metros cúbicos son? (1 L = 1 dm³)',pista:'1 dm = 10⁻¹ m, así que 1 dm³ = (10⁻¹ m)³.',sol:'1 dm³ = (10⁻¹ m)³ = 10⁻³ m³<br>1,5 L = 1,5 dm³ = 1,5 × 10⁻³ m³'},
  {id:'p19',tema:'dimensional',nivel:2,en:'El período de un péndulo es T = 2π √(L / g), con L la longitud del hilo y g la gravedad. Comprueba que la fórmula es dimensionalmente correcta.',pista:'2π no tiene dimensión. Calcula [L / g] y luego saca la raíz.',sol:'[L / g] = L / (L T⁻²) = T²<br>[√(L / g)] = T<br>[T] = T: la fórmula es correcta'},
  {id:'p20',tema:'dimensional',nivel:3,en:'En E = A · v² + B · h, E es una energía, v una velocidad y h una altura. Halla las dimensiones de A y de B.',pista:'Cada sumando debe tener la dimensión de la energía, M L² T⁻².',sol:'[A] · L² T⁻² = M L² T⁻² → [A] = M (una masa)<br>[B] · L = M L² T⁻² → [B] = M L T⁻² (una fuerza)'},
  {id:'p21',tema:'vectores',nivel:1,en:'Dos fuerzas de 6 N y 8 N empujan un objeto. ¿Cuánto vale la resultante si van en el mismo sentido, en sentidos opuestos y si son perpendiculares?',pista:'Mismo sentido se suman, opuestos se restan, perpendiculares: Pitágoras.',sol:'Mismo sentido: 6 + 8 = 14 N<br>Opuestos: 8 − 6 = 2 N<br>Perpendiculares: √(36 + 64) = 10 N'},
  {id:'p22',tema:'vectores',nivel:2,en:'Dos vectores de 5 u cada uno forman un ángulo de 60°. Halla el módulo de su resultante.',pista:'R = √(A² + B² + 2·A·B·cos θ) y cos 60° = 0,5.',sol:'R = √(25 + 25 + 2 · 5 · 5 · 0,5)<br>R = √75 = 5√3 ≈ 8,66 u'},
  {id:'p23',tema:'vectores',nivel:3,en:'Un vector de 20 u forma 53° con el eje x, y otro de 10 u apunta hacia la izquierda (180°). Halla la resultante usando componentes (cos 53° ≈ 0,6 y sen 53° ≈ 0,8).',pista:'Descompón el primero, suma las x por un lado y las y por otro.',sol:'A = (20 · 0,6 ; 20 · 0,8) = (12 ; 16)<br>B = (−10 ; 0)<br>R = (2 ; 16)<br>|R| = √(4 + 256) = √260 ≈ 16,1 u'},
  {id:'p24',tema:'mruv',nivel:1,en:'Una moto pasa de 4 m/s a 16 m/s en 3 s. ¿Cuál es su aceleración?',pista:'a = (v − v₀) / t.',sol:'a = (16 − 4) / 3<br>a = 4 m/s²'},
  {id:'p25',tema:'mruv',nivel:2,en:'Un auto va a 72 km/h, frena y se detiene en 40 m. ¿Cuál fue su desaceleración y cuánto tardó?',pista:'Pasa a m/s. Al detenerse v = 0; usa v² = v₀² − 2·a·d.',sol:'72 km/h = 20 m/s<br>0 = 20² − 2 · a · 40 → a = 400 / 80 = 5 m/s²<br>t = 20 / 5 = 4 s'},
  {id:'p26',tema:'mruv',nivel:3,en:'Un auto parte del reposo con a = 2 m/s² justo cuando un bus pasa a su lado a 10 m/s constantes. ¿Cuándo y dónde lo alcanza?',pista:'Auto: x = ½ · 2 · t². Bus: x = 10 · t. Iguala.',sol:'Auto: x = t²<br>Bus: x = 10t<br>t² = 10t → t = 10 s<br>x = 10 · 10 = 100 m (el auto va a 20 m/s)'},
  {id:'p27',tema:'caida',nivel:1,en:'Una piedra se suelta desde 80 m de altura (g = 10 m/s²). ¿Cuánto tarda en llegar al suelo y con qué rapidez llega?',pista:'Se suelta: v₀ = 0. Usa h = ½·g·t² y v = g·t.',sol:'80 = ½ · 10 · t² → t² = 16 → t = 4 s<br>v = 10 · 4 = 40 m/s'},
  {id:'p28',tema:'caida',nivel:2,en:'Lanzas una pelota hacia arriba a 30 m/s (g = 10 m/s²). Halla la altura máxima y el tiempo que tarda en volver a tu mano.',pista:'h_máx = v₀² / (2g). Sube en v₀ / g y baja en lo mismo.',sol:'h_máx = 30² / 20 = 45 m<br>t subida = 30 / 10 = 3 s<br>t total = 2 · 3 = 6 s'},
  {id:'p29',tema:'caida',nivel:3,en:'Desde una azotea de 25 m lanzas una piedra hacia arriba a 20 m/s (g = 10 m/s²). ¿Cuánto tarda en llegar al suelo?',pista:'Toma el suelo como y = 0: y = 25 + 20t − 5t². Cuando llega al suelo, y = 0.',sol:'25 + 20t − 5t² = 0<br>t² − 4t − 5 = 0<br>(t − 5)(t + 1) = 0<br>t = 5 s (el −1 no sirve)'},
  {id:'p30',tema:'circular',nivel:1,en:'Un ventilador da 300 vueltas en 1 minuto. Halla su frecuencia, su período y su velocidad angular.',pista:'f = vueltas / tiempo en segundos. T = 1 / f. ω = 2π · f.',sol:'f = 300 / 60 = 5 vueltas/s = 5 Hz<br>T = 1 / 5 = 0,2 s<br>ω = 2π · 5 = 10π ≈ 31,4 rad/s'},
  {id:'p31',tema:'circular',nivel:2,en:'Un punto está a 0,2 m del centro de un disco que gira a 10 rad/s. Halla su rapidez y su aceleración centrípeta.',pista:'v = ω · r y la aceleración centrípeta es v² / r.',sol:'v = 10 · 0,2 = 2 m/s<br>a = 2² / 0,2 = 4 / 0,2 = 20 m/s²'}
];
const {$,$$,store,m}=Kit;
const name=id=>(TEMAS.find(t=>t.id===id)||{}).titulo||id;
const temas=[...new Set(PROBLEMAS.map(p=>p.tema))];
$('#fT').innerHTML='<button data-k="" aria-pressed="true">Todos los temas</button>'+temas.map(t=>'<button data-k="'+t+'" aria-pressed="false">'+name(t)+'</button>').join('');
let ft='',fl=0;
function render(){const solved=store.get('resueltos',{});
  const list=PROBLEMAS.filter(p=>(!ft||p.tema===ft)&&(!fl||p.nivel===fl));
  $('#count').textContent=list.length+' problemas · resueltos: '+list.filter(p=>solved[p.id]).length;
  $('#list').innerHTML=list.map((p,i)=>'<article class="pb'+(solved[p.id]?' solved':'')+'"><div class="meta"><span>'+name(p.tema)+'</span><span class="lv">'+'★'.repeat(p.nivel)+'</span></div>'+
    '<p class="en"><b>'+(i+1)+'.</b> '+m(p.en)+'</p><details><summary>Ver pista</summary><p style="margin:6px 0">'+m(p.pista)+'</p></details>'+
    '<details><summary>Ver solución</summary><p class="sol">'+m(p.sol)+'</p></details>'+
    '<button class="btn '+(solved[p.id]?'':'ghost ')+'solvebtn" type="button" data-id="'+p.id+'">'+(solved[p.id]?'✓ Resuelto':'Lo resolví')+'</button></article>').join('');
  $$('.solvebtn').forEach(b=>b.addEventListener('click',()=>{const s=store.get('resueltos',{});if(s[b.dataset.id])delete s[b.dataset.id];else s[b.dataset.id]=1;store.set('resueltos',s);render();}));}
function pick(host,cb){$$('button',host).forEach(b=>b.addEventListener('click',()=>{$$('button',host).forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.k);render();}));}
pick($('#fT'),k=>ft=k);pick($('#fL'),k=>fl=+k);render();
})();
</script>
</body>
</html>
