<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Física · Examen 1 · El cuaderno de Stacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/estilo.css">
<style>
.bar{position:sticky;top:var(--stick,52px);z-index:3;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bar .t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ex .q.right{border-color:var(--ok)} .ex .q.wrong{border-color:var(--bad)}
.ex .exp{font-size:15px;margin:6px 0 0;display:none}
.done .exp{display:block}
.score{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;text-align:center;margin:24px 0}
.score b{font-family:var(--display);font-size:54px;display:block;line-height:1}
.score .row{justify-content:center}
.score .btn{background:var(--card);color:var(--accent)}
.err{color:var(--bad);font-size:14px}
</style>
</head>
<body data-base="../" data-nav="examenes">
<main>
  <div class="crumb"><a href="index.html">Exámenes</a><span>Física</span></div>
  <h1>Física · Examen 1</h1>
  <p class="lede">8 preguntas de unidades, análisis dimensional, vectores, MRU, MRUV, caída libre y movimiento circular. Ten a mano papel, lápiz y calculadora.</p>
  <div class="bar"><span id="prog">0 de 8 respondidas</span><span class="t" id="clock">00:00</span></div>
  <form class="ex" id="ex" novalidate></form>
  <div id="result"></div>
</main>
<script src="../assets/datos.js"></script>
<script src="../assets/kit.js"></script>
<script>
(function(){
const EXAMEN={id:'fisica-1',titulo:'Física · Examen 1',preguntas:[
  {q:'¿A cuántos m/s equivalen 54 km/h?',o:['15 m/s','54 m/s','150 m/s','19,4 m/s'],a:0,e:'54 / 3,6 = 15 m/s.'},
  {q:'¿Cuál es la dimensión de la potencia (P = energía / tiempo)?',o:['M L² T⁻²','M L² T⁻³','M L T⁻²','M L² T⁻¹'],a:1,e:'[E] = M L² T⁻², y al dividir entre T queda M L² T⁻³.'},
  {q:'Dos fuerzas de 6 N y 8 N son perpendiculares. ¿Cuánto vale la resultante?',o:['14 N','2 N','10 N','48 N'],a:2,e:'√(6² + 8²) = √100 = 10 N.'},
  {q:'Dos autos están separados 300 m y van uno hacia el otro a 20 m/s y 10 m/s. ¿En cuánto tiempo se encuentran?',o:['10 s','30 s','15 s','20 s'],a:0,e:'Se acercan a 20 + 10 = 30 m/s: t = 300 / 30 = 10 s.'},
  {q:'Un auto parte del reposo con a = 3 m/s². ¿Cuánto avanza en 4 s?',o:['12 m','24 m','48 m','6 m'],a:1,e:'x = ½ · 3 · 4² = 1,5 · 16 = 24 m.'},
  {q:'Se suelta una piedra desde 20 m de altura (g = 10 m/s²). ¿Cuánto tarda en llegar al suelo?',o:['4 s','1 s','2 s','√2 s'],a:2,e:'20 = ½ · 10 · t² → t² = 4 → t = 2 s.'},
  {q:'Lanzas una pelota hacia arriba a 15 m/s (g = 10 m/s²). ¿Qué altura máxima alcanza?',o:['11,25 m','22,5 m','15 m','7,5 m'],a:0,e:'h = 15² / (2 · 10) = 225 / 20 = 11,25 m.'},
  {q:'Un punto gira en una circunferencia de 2 m de radio y da una vuelta cada 4 s. ¿Cuál es su rapidez?',o:['≈ 3,14 m/s','8 m/s','0,5 m/s','≈ 1,57 m/s'],a:0,e:'v = 2πr / T = 2π · 2 / 4 = π ≈ 3,14 m/s.'}
]};
const {$,$$,store,m}=Kit,P=EXAMEN.preguntas,form=$('#ex');
form.innerHTML=P.map((p,i)=>'<div class="q" id="q'+i+'"><p><b>'+(i+1)+'.</b> '+m(p.q)+'</p>'+p.o.map((o,j)=>'<label><input type="radio" name="p'+i+'" value="'+j+'"> '+m(o)+'</label>').join('')+'<p class="exp"></p></div>').join('')+
  '<div class="row"><button class="btn" type="submit">Terminar y ver mi nota</button><span class="err" id="err" aria-live="polite"></span></div>';
const t0=Date.now();let tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},1000);
form.addEventListener('change',()=>{const n=P.filter((p,i)=>$('input[name="p'+i+'"]:checked')).length;$('#prog').textContent=n+' de '+P.length+' respondidas';$('#err').textContent='';});
form.addEventListener('submit',e=>{e.preventDefault();
  const miss=P.map((p,i)=>$('input[name="p'+i+'"]:checked')?null:i+1).filter(Boolean);
  if(miss.length){$('#err').textContent='Te falta responder: '+miss.join(', ')+'.';return;}
  clearInterval(tick);const secs=Math.floor((Date.now()-t0)/1000),mins=Math.max(1,Math.round(secs/60));let ok=0;
  P.forEach((p,i)=>{const v=+$('input[name="p'+i+'"]:checked').value,q=$('#q'+i),r=v===p.a;if(r)ok++;q.classList.add(r?'right':'wrong');
    $('.exp',q).innerHTML=(r?'<span style="color:var(--ok)">✓ Correcto.</span> ':'<span style="color:var(--bad)">✗ La respuesta era: '+p.o[p.a]+'.</span> ')+m(p.e);});
  form.classList.add('done');$$('input,button[type=submit]',form).forEach(x=>x.disabled=true);
  const nota=ok+'/'+P.length,vig=Math.round(ok/P.length*20),best=store.get('notas',{});
  const prev=best[EXAMEN.id]?+best[EXAMEN.id].split('/')[0]:-1;if(ok>prev){best[EXAMEN.id]=nota;store.set('notas',best);}
  const msg='Hola! Soy '+SITE.apodo+' 😊 Terminé "'+EXAMEN.titulo+'" y saqué '+nota+' (equivale a '+vig+' sobre 20) en '+mins+' min.';
  const wa='https://wa.me/'+(SITE.whatsapp||'')+'?text='+encodeURIComponent(msg);
  $('#result').innerHTML='<div class="score"><span>Tu nota</span><b>'+nota+'</b><span>'+vig+' sobre 20 · '+mins+' min</span><p>'+(ok===P.length?'¡Perfecto! Dominas el tema.':ok>=6?'¡Muy bien! Revisa abajo las que fallaste.':'Repasa las lecciones de las preguntas en rojo y vuelve a intentarlo.')+'</p>'+
    '<div class="row"><a class="btn" href="'+wa+'" target="_blank" rel="noopener">Enviar mi nota por WhatsApp</a><a class="btn" href="fisica-1.html">Intentar de nuevo</a></div></div>';
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});});
})();
</script>
</body>
</html>
