<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica tipo OMASUR · El cuaderno de Stacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/estilo.css">
<style>
.bar{position:sticky;top:var(--stick,52px);z-index:3;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bar .t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ex .q.right{border-color:var(--ok)} .ex .q.wrong{border-color:var(--bad)}
.ex .exp{font-size:15px;margin:6px 0 0;display:none}
.done .exp{display:block}
.score{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;text-align:center;margin:24px 0}
.score b{font-family:var(--display);font-size:54px;display:block;line-height:1}
.score .row{justify-content:center}
.score .btn{background:var(--card);color:var(--accent)}
.err{color:var(--bad);font-size:14px}
.ex .fig{display:block;margin:4px 0 10px;color:var(--ink)}
</style>
</head>
<body data-base="../" data-nav="examenes">
<main>
  <div class="crumb"><a href="index.html">Exámenes</a><span>Práctica tipo OMASUR</span></div>
  <h1>Práctica tipo OMASUR</h1>
  <p class="lede">20 problemas del mismo tipo que el concurso OMASUR-UNI 2026 (3.º de secundaria), con otros números. Sin calculadora, como en el concurso.</p>
  <div class="bar"><span id="prog">0 de 20 respondidas</span><span class="t" id="clock">00:00</span></div>
  <form class="ex" id="ex" novalidate></form>
  <div id="result"></div>
</main>
<script src="../assets/datos.js"></script>
<script src="../assets/kit.js"></script>
<script>
(function(){
const EXAMEN={id:'omasur-practica',titulo:'Práctica tipo OMASUR',preguntas:[
  {q:'Una tienda aumenta el costo de un artículo en 80% para fijar su precio, pero al venderlo hace un descuento del 25% del precio fijado. ¿Qué porcentaje del costo gana?',o:['35%','55%','45%','60%','20%'],a:0,e:'Precio fijado = 1,8 · C. Venta = 0,75 · 1,8 · C = 1,35 · C. Gana 35% del costo.'},
  {q:'Halla el conjunto solución de 4(a − 2x) + 3(3x − a) − 2(x + a) + 2a = 0.',o:['∅','{a}','{−a}','{a/2}','{2a}'],a:1,e:'4a − 8x + 9x − 3a − 2x − 2a + 2a = a − x = 0, así que x = a.'},
  {q:'Dos descuentos sucesivos del 20% y del 10% equivalen a un único descuento de:',o:['30%','28%','25%','32%','2%'],a:1,e:'Queda 0,8 · 0,9 = 0,72 del precio, o sea 72%: el descuento único es 28%, no 30%.'},
  {q:'Pintar un cubo de arista A cuesta N soles. ¿Cuánto costará pintar un paralelepípedo de A, A y 2A?',o:['5N/3','2N','4N/3','5N/2','3N'],a:0,e:'Cubo: 6A². Paralelepípedo: 2(A² + 2A² + 2A²) = 10A². Cuesta 10/6 · N = 5N/3.'},
  {q:'N obreros hacen una obra en d días. Si desde el inicio se suman b obreros más, ¿en cuántos días la terminan?',o:['Nd / (N + b)','(N + b)d / N','Nd / b','d − b','bd / (N + b)'],a:0,e:'La obra equivale a N · d "días-obrero". Con N + b obreros: d\' = N · d / (N + b).'},
  {q:'Un albañil y su ayudante hacen una obra en 20 días. Tras 5 días juntos, el ayudante se retira y el albañil termina solo en 25 días. ¿En cuántos días haría la obra el ayudante solo?',o:['30','40','50','60','100'],a:2,e:'Juntos hacen 1/20 por día: en 5 días, 1/4. El albañil hace 3/4 en 25 días: 3/100 por día. Ayudante: 1/20 − 3/100 = 2/100 = 1/50 → 50 días.'},
  {q:'Un factor de E = (a + b)³ − (a − b)³ es:',o:['a − b','a + b','3a² + b²','a² + 3b²','a² − b²'],a:2,e:'E = 2(3a²b + b³) = 2b(3a² + b²).'},
  {q:'Si f(x) = √(x + 4) con x ∈ [0 ; 5], ¿cuál es el rango de f?',o:['[0 ; 3]','[2 ; 3]','[4 ; 9]','[2 ; 9]','[0 ; 5]'],a:1,e:'x + 4 va de 4 a 9; su raíz va de 2 a 3. Rango: [2 ; 3].'},
  {q:'f = {(a + b ; 2b), (1 ; a − b), (4 ; 7), (1 ; 1), (4 ; a + b)} es una función. Halla la suma de los elementos de su rango.',o:['8','11','14','17','21'],a:2,e:'Mismo x, misma salida: a − b = 1 y a + b = 7, así que a = 4, b = 3. f = {(7 ; 6), (1 ; 1), (4 ; 7)}. Rango {6 ; 1 ; 7}: suma 14.'},
  {q:'La ecuación x² + bx + c = 0 tiene raíces 5 + √2 y 5 − √2. ¿Cuánto vale c − b?',o:['13','23','33','43','25'],a:2,e:'Suma de raíces = 10 = −b → b = −10. Producto = 25 − 2 = 23 = c. c − b = 23 + 10 = 33.'},
  {q:'Halla la suma de los enteros que cumplen x/(x − 2) − 3/(x + 1) ≤ 0.',o:['−1','0','1','2','3'],a:2,e:'Juntando: (x² − 2x + 6) / ((x − 2)(x + 1)) ≤ 0. El numerador siempre es positivo, así que (x − 2)(x + 1) < 0 → −1 < x < 2. Enteros: 0 y 1, suma 1.'},
  {q:'Al factorizar x⁴ + 4 en dos factores cuadráticos, la suma de los factores es:',o:['2x² + 4','2x² + 2','4x','x² + 2','2x²'],a:0,e:'x⁴ + 4 = (x² + 2)² − (2x)² = (x² + 2x + 2)(x² − 2x + 2). Sumados: 2x² + 4.'},
  {q:'Si 20 gallinas ponen 20 huevos en 20 días, y 10 gallinas comen 10 kg de maíz en 10 días, ¿cuántos kg de maíz comerán 5 gallinas mientras ponen 5 huevos?',o:['5','10','20','2,5','15'],a:1,e:'Cada gallina pone 1 huevo en 20 días, así que 5 gallinas ponen 5 huevos en 20 días. Cada gallina come 1 kg cada 10 días: 5 · 20 / 10 = 10 kg.'},
  {q:'Un lechero agrega agua igual al 25% de la leche. Un restaurante le compra 40 L; el cocinero saca 10 L y los repone con agua, y el dueño agrega 8 L más de agua. ¿Qué porcentaje del líquido final es leche pura?',o:['40%','45%','50%','55%','60%'],a:2,e:'En 40 L hay 32 de leche (4/5). Al sacar 10 L se van 8 de leche: quedan 24. El líquido final mide 40 + 8 = 48 L: 24/48 = 50%.'},
  {q:'<svg class="fig" viewBox="-30 -24 230 222" width="230" role="img" aria-label="Cuadrado BCDA de 2 m de lado con M en la mitad de BC, N en la mitad de AD y el rombo central sombreado"><polygon points="80,0 40,80 80,160 120,80" fill="var(--accent-soft)" stroke="none"/><rect x="0" y="0" width="160" height="160" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="1.5" fill="none"><line x1="80" y1="0" x2="0" y2="160"/><line x1="80" y1="0" x2="160" y2="160"/><line x1="80" y1="160" x2="0" y2="0"/><line x1="80" y1="160" x2="160" y2="0"/></g><g font-size="14" fill="currentColor" font-family="Lexend"><text x="-18" y="2">B</text><text x="166" y="2">C</text><text x="-18" y="168">A</text><text x="166" y="168">D</text><text x="74" y="-8">M</text><text x="74" y="182">N</text></g></svg><br>El cuadrado mide 2 m de lado; M y N son puntos medios de BC y AD. ¿Cuál es el área (en m²) de la región sombreada?',o:['1/2','1','2','3/2','1/4'],a:1,e:'Las rectas se cortan a media altura, a 0,5 m de cada lado. El rombo tiene diagonales de 2 m y 1 m: área = 2 · 1 / 2 = 1 m², la cuarta parte del cuadrado.'},
  {q:'Si a·[1 0 ; 1 1] + b·[0 1 ; 1 0] + c·[1 1 ; 0 2] = [5 4 ; 5 7], halla a + b + c. (Cada matriz se escribe fila por fila.)',o:['5','6','7','8','9'],a:2,e:'Casilla por casilla: a + c = 5, b + c = 4, a + b = 5, a + 2c = 7. De la 1.ª y la 4.ª: c = 2, a = 3; b = 2. Suma 7.'},
  {q:'Las tres dimensiones de un rectoedro están en progresión aritmética y suman 18. Si su área total es 208, ¿cuál es su volumen?',o:['160','180','192','200','216'],a:2,e:'Dimensiones 6 − r, 6, 6 + r. Área: 2(108 − r²) = 208 → r = 2. Medidas 4, 6, 8: volumen 192.'},
  {q:'Una pirámide tiene 11 caras. ¿Cuánto suman los ángulos internos de todas sus caras?',o:['2880°','3060°','3240°','3420°','3600°'],a:2,e:'11 caras = 1 base de 10 lados + 10 triángulos. Base: 180° · 8 = 1440°. Triángulos: 10 · 180° = 1800°. Total 3240°.'},
  {q:'Una pirámide cuadrangular regular tiene base de 16 de lado y apotema (altura de cada cara) 10. ¿Cuánto mide su altura?',o:['4','6','8','10','12'],a:1,e:'La altura, la mitad del lado (8) y la apotema forman un triángulo rectángulo: h = √(10² − 8²) = 6.'},
  {q:'<svg class="fig" viewBox="-28 -24 220 210" width="220" role="img" aria-label="Cuadrado ABCD con F sobre AB, E sobre AD y los triángulos FAE, EDC y CBF sombreados"><g fill="var(--accent-soft)"><polygon points="0,0 99,0 0,99"/><polygon points="0,99 0,160 160,160"/><polygon points="160,160 160,0 99,0"/></g><rect x="0" y="0" width="160" height="160" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="1.5"><line x1="99" y1="0" x2="0" y2="99"/><line x1="0" y1="99" x2="160" y2="160"/><line x1="160" y1="160" x2="99" y2="0"/></g><g font-size="14" fill="currentColor" font-family="Lexend"><text x="-18" y="2">A</text><text x="166" y="2">B</text><text x="-18" y="168">D</text><text x="166" y="168">C</text><text x="93" y="-8">F</text><text x="-18" y="103">E</text></g></svg><br>En el cuadrado ABCD los triángulos FAE, EDC y CBF tienen la misma área. ¿Cuánto vale AF / AB?',o:['1/2','2/3','(√5 − 1)/2','(3 − √5)/2','√2/2'],a:2,e:'Con lado 1, AF = p, AE = q: pq/2 = (1 − q)/2 = (1 − p)/2. Entonces p = q y p² = 1 − p → p = (√5 − 1)/2 ≈ 0,618.'}
]};
const {$,$$,store,m}=Kit,P=EXAMEN.preguntas,form=$('#ex');
form.innerHTML=P.map((p,i)=>'<div class="q" id="q'+i+'"><p><b>'+(i+1)+'.</b> '+m(p.q)+'</p>'+p.o.map((o,j)=>'<label><input type="radio" name="p'+i+'" value="'+j+'"> '+m(o)+'</label>').join('')+'<p class="exp"></p></div>').join('')+
  '<div class="row"><button class="btn" type="submit">Terminar y ver mi nota</button><span class="err" id="err" aria-live="polite"></span></div>';
const t0=Date.now();let tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},1000);
form.addEventListener('change',()=>{const n=P.filter((p,i)=>$('input[name="p'+i+'"]:checked')).length;$('#prog').textContent=n+' de '+P.length+' respondidas';$('#err').textContent='';});
form.addEventListener('submit',e=>{e.preventDefault();
  const miss=P.map((p,i)=>$('input[name="p'+i+'"]:checked')?null:i+1).filter(Boolean);
  if(miss.length){$('#err').textContent='Te falta responder: '+miss.join(', ')+'.';return;}
  clearInterval(tick);const secs=Math.floor((Date.now()-t0)/1000),mins=Math.max(1,Math.round(secs/60));let ok=0;
  P.forEach((p,i)=>{const v=+$('input[name="p'+i+'"]:checked').value,q=$('#q'+i),r=v===p.a;if(r)ok++;q.classList.add(r?'right':'wrong');
    $('.exp',q).innerHTML=(r?'<span style="color:var(--ok)">✓ Correcto.</span> ':'<span style="color:var(--bad)">✗ La respuesta era: '+p.o[p.a]+'.</span> ')+m(p.e);});
  form.classList.add('done');$$('input,button[type=submit]',form).forEach(x=>x.disabled=true);
  const nota=ok+'/'+P.length,vig=Math.round(ok/P.length*20),best=store.get('notas',{});
  const prev=best[EXAMEN.id]?+best[EXAMEN.id].split('/')[0]:-1;if(ok>prev){best[EXAMEN.id]=nota;store.set('notas',best);}
  const msg='Hola! Soy '+SITE.apodo+' 😊 Terminé "'+EXAMEN.titulo+'" y saqué '+nota+' (equivale a '+vig+' sobre 20) en '+mins+' min.';
  const wa='https://wa.me/'+(SITE.whatsapp||'')+'?text='+encodeURIComponent(msg);
  $('#result').innerHTML='<div class="score"><span>Tu nota</span><b>'+nota+'</b><span>'+vig+' sobre 20 · '+mins+' min</span><p>'+(ok===P.length?'¡Perfecto! Dominas el tema.':ok>=6?'¡Muy bien! Revisa abajo las que fallaste.':'Repasa las lecciones de las preguntas en rojo y vuelve a intentarlo.')+'</p>'+
    '<div class="row"><a class="btn" href="'+wa+'" target="_blank" rel="noopener">Enviar mi nota por WhatsApp</a><a class="btn" href="omasur-practica.html">Intentar de nuevo</a></div></div>';
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});});
})();
</script>
</body>
</html>
